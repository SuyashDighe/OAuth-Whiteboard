version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: oauth_whiteboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: oauth_whiteboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oauth_whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oauth_whiteboard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/oauth_whiteboard
      - SECRET_KEY=production-secret-key-replace-with-a-real-secret-at-least-32-chars
      - ENCRYPTION_KEY=WQDLrdl3PMCzsNNFPJMb2VSkO3ZxLlXtAzzQe_PoJi4=
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-mock-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-mock-google-client-secret}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/oauth/google/callback}
      - DEFAULT_USER_ID=user_prod_01
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
